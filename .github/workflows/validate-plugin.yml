name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate plugin manifests and bundled skills
        run: python scripts/validate_plugin.py
      - name: Check patch whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"
